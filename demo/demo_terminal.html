<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Perseus Memory Agent — Google Cloud × Elastic Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; font-family: 'JetBrains Mono', 'Fira Code', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 40px; }
  .terminal { width: 1100px; max-width: 100%; background: #161b22; border-radius: 8px; border: 1px solid #30363d; overflow: hidden; box-shadow: 0 0 40px rgba(88, 166, 255, 0.1); }
  .titlebar { background: #21262d; padding: 10px 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #30363d; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.red { background: #ff5f56; } .dot.yellow { background: #ffbd2e; } .dot.green { background: #27c93f; }
  .titlebar-text { color: #8b949e; font-size: 12px; margin-left: 12px; }
  .screen { height: 400px; padding: 16px 20px; overflow-y: auto; font-size: 13px; line-height: 1.65; scroll-behavior: smooth; }
  .screen::-webkit-scrollbar { width: 6px; }
  .screen::-webkit-scrollbar-track { background: #0d1117; }
  .screen::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
  .line { margin: 2px 0; opacity: 0; animation: fadeIn 0.3s forwards; white-space: pre-wrap; word-break: break-word; }
  @keyframes fadeIn { to { opacity: 1; } }
  .label { color: #8b949e; font-size: 11px; margin: 8px 0 4px; border-top: 1px solid #21262d; padding-top: 8px; }
  .user { color: #58a6ff; } .user::before { content: '▸ '; }
  .agent { color: #3fb950; } .agent::before { content: '● '; }
  .system { color: #bc8cff; } .system::before { content: '◆ '; }
  .memory { color: #d2991d; } .memory::before { content: '◈ '; }
  .elastic { color: #00bfb3; } .elastic::before { content: '⬡ '; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; margin-right: 4px; }
  .badge.store { background: #1f3a1f; color: #3fb950; }
  .badge.recall { background: #1a2e3a; color: #58a6ff; }
  .badge.search { background: #1a3a3a; color: #00bfb3; }
  .badge.insight { background: #2e1a3a; color: #bc8cff; }
  .badge.swap { background: #3a2a1a; color: #d2991d; }
  .highlight { color: #f0883e; font-weight: bold; }
</style>
</head>
<body>
<div class="terminal">
  <div class="titlebar">
    <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
    <span class="titlebar-text">perseus-memory-agent — demo</span>
  </div>
  <div class="screen" id="screen"></div>
</div>

<script>
const screen = document.getElementById('screen');
const SCENES = [
  // Scene 1: Project Introduction + Elastic Setup
  { delay: 0, lines: [
    ['label', '── Session 1: Project Onboarding ──'],
    ['system', 'Perseus Memory Agent · Google Cloud Agent Builder · Elastic Partner Track'],
    ['elastic', 'Elastic Cloud connected: hybrid search (ELSER + BM25) · index: perseus-agent-memory'],
    ['user', 'I\'m building a microservices platform. Stack: Python, FastAPI, PostgreSQL, Redis, K8s. We use async/await, type hints, pytest, and Black. Architecture is microservices with API gateway and RabbitMQ.'],
    ['agent', 'Got it. Let me store your full project context in Elastic.'],
    ['system', '<span class="badge store">store</span> Stack: Python 3.12, FastAPI, PostgreSQL, Redis, Docker, K8s'],
    ['system', '<span class="badge store">store</span> Convention: async/await for all I/O · type hints on public fns'],
    ['system', '<span class="badge store">store</span> Convention: pytest + pytest-cov · Black (100 char line length)'],
    ['system', '<span class="badge store">store</span> Architecture: Microservices + API gateway + RabbitMQ (event-driven)'],
    ['elastic', 'Elasticsearch: 5 documents indexed · <span class="badge search">hybrid</span> ELSER semantic + BM25 keyword'],
    ['user', 'What conventions should I follow when I start coding today?'],
    ['agent', 'Based on your project context stored in Elastic:'],
    ['agent', '• <span class="highlight">async/await</span> for all I/O operations'],
    ['agent', '• <span class="highlight">Type hints</span> on all public functions'],
    ['agent', '• <span class="highlight">pytest</span> with pytest-cov for testing coverage'],
    ['agent', '• <span class="highlight">Black</span> formatter, 100-character line length'],
    ['system', 'Session 1 complete. 5 memories stored in Elastic.'],
  ]},
  // Scene 2: Decision + Recall
  { delay: 2000, lines: [
    ['label', ''],
    ['label', '── Session 2: Next Day — Elastic Hybrid Recall ──'],
    ['system', 'Starting session... <span class="badge recall">recall</span> Loading context from Elastic...'],
    ['elastic', '<span class="badge search">hybrid</span> ELSER semantic search: "tech stack conventions" → 3 results'],
    ['elastic', '<span class="badge search">hybrid</span> BM25 keyword match: "PostgreSQL Python" → 2 results'],
    ['memory', 'Recalled: [fact] Stack: Python, FastAPI, PostgreSQL, Redis, K8s (1d ago)'],
    ['memory', 'Recalled: [preference] pytest, type hints, Black, async/await (1d ago)'],
    ['memory', 'Recalled: [fact] Architecture: Microservices + API gateway + RabbitMQ (1d ago)'],
    ['user', 'We need semantic search. Should I use Pinecone or pgvector?'],
    ['agent', 'Since you already have <span class="highlight">PostgreSQL</span> in your stack (recalled from Elastic), pgvector avoids operational complexity and vendor lock-in. Let me log this decision.'],
    ['system', '<span class="badge store">store</span> Decision: pgvector over Pinecone · rationale: PostgreSQL already in stack, simpler ops'],
    ['user', 'What endpoint structure should I use?'],
    ['agent', 'Given your <span class="highlight">FastAPI</span> + <span class="highlight">async/await</span> conventions and <span class="highlight">pgvector</span>: POST /search (semantic), GET /search/index (health), asyncpg for connection pooling.'],
    ['system', 'Session 2 complete. 3 new memories. Elastic hybrid search retrieved exact context.'],
  ]},
  // Scene 3: Knowledge Compounding + Backend Swap
  { delay: 2000, lines: [
    ['label', ''],
    ['label', '── Session 3: One Week Later — Knowledge Compounds ──'],
    ['system', 'Starting session... <span class="badge recall">recall</span> Elastic: 11 memories across 4 categories'],
    ['memory', 'Recalled: stack (7d), conventions (7d), pgvector decision (6d), architecture (7d)'],
    ['user', 'Onboard a new developer. What should they know?'],
    ['agent', 'Here\'s everything I know across 3 sessions:'],
    ['agent', ''],
    ['agent', '<span class="highlight">Stack:</span> Python 3.12, FastAPI, PostgreSQL + pgvector, Redis, Docker, K8s'],
    ['agent', '<span class="highlight">Architecture:</span> Microservices, API gateway, event-driven (RabbitMQ)'],
    ['agent', '<span class="highlight">Conventions:</span> async/await, type hints, pytest, Black (100 chars)'],
    ['agent', '<span class="highlight">Key Decision:</span> pgvector over Pinecone — simpler ops, no vendor lock-in'],
    ['agent', ''],
    ['agent', 'This knowledge compounds across sessions. Every time we talk, I get smarter about your codebase.'],
    ['system', '<span class="badge insight">insight</span> Compound: Python+PostgreSQL stack is consistent — no conflicting tech choices'],
    ['system', '<span class="badge insight">insight</span> Compound: All API decisions favor simplicity (pgvector, REST, async)'],
    ['label', ''],
    ['label', '── Backend Swap: Elastic → Engram-rs ──'],
    ['system', '<span class="badge swap">swap</span> MEMORY_BACKEND=elastic → MEMORY_BACKEND=engram'],
    ['system', 'Same MemoryBackend interface. Same 13 memories. Zero code changes.'],
    ['elastic', 'Elastic Cloud (managed, hybrid ELSER+BM25) → Engram-rs (self-hosted, MIT, SQLite+FTS5)'],
    ['agent', 'Identical recall quality. Running entirely on your hardware. <span class="highlight">MIT licensed, no API keys, no cloud.</span>'],
  ]},
  // Scene 4: Closing
  { delay: 2000, lines: [
    ['label', ''],
    ['label', '── Perseus Memory Agent — Summary ──'],
    ['agent', '✓ <span class="highlight">Persistent memory</span> — agent remembers across sessions · Elastic hybrid search'],
    ['agent', '✓ <span class="highlight">Cross-session compounding</span> — gets smarter over time'],
    ['agent', '✓ <span class="highlight">Swappable backends</span> — Elastic Cloud (managed) ↔ Engram-rs (self-hosted, MIT)'],
    ['agent', '✓ <span class="highlight">Google Cloud</span> Agent Builder + Gemini 3 Pro'],
    ['agent', '✓ <span class="highlight">Elastic</span> Partner Track — ELSER + BM25 hybrid search via MCP'],
    ['agent', ''],
    ['agent', '<span class="highlight">github.com/tcconnally/perseus-rapid-agent</span>  ·  MIT License'],
    ['agent', 'Google Cloud Rapid Agent Hackathon 2026 · Elastic Partner Track'],
  ]},
];

let sceneI = 0, lineI = 0, done = false;
function play() {
  if (done) return;
  if (sceneI >= SCENES.length) { done = true; return; }
  const scene = SCENES[sceneI];
  if (lineI >= scene.lines.length) { sceneI++; lineI = 0; setTimeout(play, sceneI < SCENES.length ? SCENES[sceneI].delay : 0); return; }
  const [type, text] = scene.lines[lineI];
  const div = document.createElement('div');
  div.className = `line ${type}`;
  div.innerHTML = text;
  screen.appendChild(div);
  screen.scrollTo({top: screen.scrollHeight, behavior: 'smooth'});
  lineI++;
  const delay = type === 'label' ? 400 : type === 'system' ? 320 : type === 'elastic' ? 350 : type === 'memory' ? 280 : type === 'agent' ? 600 : type === 'user' ? 500 : 400;
  setTimeout(play, delay);
}
setTimeout(play, 800);
</script>
</body>
</html>
